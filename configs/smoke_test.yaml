seed: 42

paths:
  data_dir: data-bin/smoke_wmt14_ende
  tokenizer_model: assets/tokenizer/wmt14_ende_sp.model
  output_dir: outputs-smoke

dataset:
  name: wmt14
  config: de-en
  direction: en-de
  train_split: train[:20000]
  valid_split: validation[:500]
  test_split: test[:500]
  max_src_len: 128
  max_tgt_len: 128
  length_ratio_filter: 3.0

model:
  encoder_layers: 2
  decoder_layers: 2
  d_model: 256
  d_ff: 1024
  num_heads: 4
  dropout: 0.1
  attention_dropout: 0.1
  max_positions: 256
  share_src_tgt_embedding: true
  share_tgt_embedding_projection: true
  scale_embedding: true
  norm_first: false

train:
  max_update_steps: 1000
  tokens_per_micro_batch_target: 1024
  grad_accum_steps: 2
  num_workers: 0
  precision: bf16
  deterministic: false
  optimizer: adam
  beta1: 0.9
  beta2: 0.98
  eps: 1.0e-9
  warmup_steps: 400
  label_smoothing: 0.1
  loss_chunk_tokens: 256
  grad_clip: null
  save_every_steps: 200
  keep_last_checkpoints: 3
  log_every_steps: 10
  validate_every_steps: 200

decode:
  beam_size: 4
  length_penalty: 0.6
  max_len_extra: 50
  batch_size: 16
  average_last_checkpoints: 3

eval:
  sacrebleu_tokenize: 13a
  lowercase: false


