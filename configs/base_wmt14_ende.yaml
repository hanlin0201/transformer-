seed: 42

paths:
  data_dir: data-bin/wmt14_ende
  tokenizer_model: assets/tokenizer/wmt14_ende_sp.model
  output_dir: outputs

dataset:
  name: wmt14
  config: de-en
  direction: en-de
  train_split: train
  valid_split: validation
  test_split: test
  max_src_len: 256
  max_tgt_len: 256
  length_ratio_filter: 3.0

model:
  encoder_layers: 6
  decoder_layers: 6
  d_model: 512
  d_ff: 2048
  num_heads: 8
  dropout: 0.1
  attention_dropout: 0.1
  max_positions: 512
  share_src_tgt_embedding: true
  share_tgt_embedding_projection: true
  scale_embedding: true
  norm_first: false

train:
  max_update_steps: 100000
  tokens_per_micro_batch_target: 2048
  grad_accum_steps: 12
  num_workers: 4
  precision: bf16
  deterministic: false
  optimizer: adam
  beta1: 0.9
  beta2: 0.98
  eps: 1.0e-9
  warmup_steps: 4000
  label_smoothing: 0.1
  loss_chunk_tokens: 256
  grad_clip: null
  save_every_steps: 2000
  keep_last_checkpoints: 10
  log_every_steps: 50
  validate_every_steps: 2000

decode:
  beam_size: 4
  length_penalty: 0.6
  max_len_extra: 50
  batch_size: 32
  average_last_checkpoints: 5

eval:
  sacrebleu_tokenize: 13a
  lowercase: false



